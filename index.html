<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>رایة الزینب</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* استایل‌های سایت شما */
    :root { --black: #0a0a0e; --deep: #10101a; --panel: #14141f; --border: #1e1e2e; --gold: #b8922a; --white: #e8e0d0; --muted: #8a8278; }
    body { background: var(--black); color: var(--white); font-family: 'Vazirmatn', sans-serif; }
    .audio-list { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
    .audio-item { background: var(--panel); border: 1px solid var(--border); padding: 20px; display: flex; align-items: center; gap: 20px; border-radius: 4px; }
    .audio-play { width: 44px; height: 44px; border-radius: 50%; background: var(--gold); border: none; cursor: pointer; }
  </style>
</head>
<body>

<section id="audio">
  <div class="audio-list">
    <div class="audio-item">
      <audio id="audio-yasin">
        <source src="https://dls.musics-fa.com/song/alibz/2026/06/Hossein%20Khalaji%20-%20Ale%20Yasin%20Musics-Fa.mp3" type="audio/mpeg">
      </audio>
      <button class="audio-play" onclick="playAudio('audio-yasin', this)">▶</button>
      <div class="audio-info">
        <div class="audio-title">آل یاسین — حسین خلجی</div>
        <div class="audio-meta">مداحی هیئت محبان اهل‌البیت</div>
      </div>
    </div>
  </div>
</section>

<script>
  function playAudio(id, btn) {
    const audio = document.getElementById(id);
    if (audio.paused) {
      audio.play();
      btn.textContent = '⏸';
    } else {
      audio.pause();
      btn.textContent = '▶';
    }
  }
</script>

</body>
</html>
